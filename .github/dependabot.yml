# Dependabot version updates (DECISIONS.md D-SEC-001, D-SEC-002).
#
# Policy: grouped weekly updates, at most 5 open pull requests per ecosystem, and
# **reviewed, never auto-merged** — there is deliberately no auto-merge workflow in this
# repository, and "Allow GitHub Actions to create and approve pull requests" is off.
# Dependabot *alerts* (vulnerability alerts) are enabled separately in repository settings.
#
# The npm entry points at the pnpm workspace root (`medrecsim/`, ADR-4); Dependabot reads
# `pnpm-lock.yaml` there. Version updates must also satisfy pnpm's one-day
# `minimumReleaseAge` guard at install time (docs/DEPENDENCY-POLICY.md §5).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/medrecsim"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
