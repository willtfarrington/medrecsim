# Dependabot version updates (DECISIONS.md D-SEC-001, D-SEC-002).
#
# Policy: grouped weekly updates, at most 5 open pull requests per ecosystem, and
# **reviewed, never auto-merged** — there is deliberately no auto-merge workflow in this
# repository, and "Allow GitHub Actions to create and approve pull requests" is off.
# Dependabot *alerts* (vulnerability alerts) are enabled separately in repository settings.
#
# The npm entry points at the pnpm workspace root (`medrecsim/`, ADR-4); Dependabot reads
# `pnpm-lock.yaml` there. Version updates must also satisfy pnpm's one-day
# `minimumReleaseAge` guard at install time (docs/DEPENDENCY-POLICY.md §5).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/medrecsim"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7.x (the native port) is not yet supported by typescript-eslint or
      # svelte-check; the toolchain pins 6.x (docs/DEPENDENCY-POLICY.md section 4). Remove this
      # rule when both peers allow 7.x. Minor/patch updates still arrive.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the pinned Node LTS line (24.x in medrecsim/.nvmrc); its major moves
      # only when the Node line does (docs/DEPENDENCY-POLICY.md section 8).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
