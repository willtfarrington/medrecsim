# SPDX-License-Identifier: CC-BY-4.0
# Fictional-universe registry (integrator resolution I-9). Every institution, program and
# recurring person that cases reference by id lives here, with the screening record that
# proves the name was checked against real organisations and notable persons before use
# (docs/NAME-SCREEN.md, fictional in-sim rule; docs/ORIGINALITY-CHECKLIST.md §3). All
# identifiers are visibly fictional (§4 of the checklist): phone/fax 555-01XX, NPIs start with 0
# and fail the check digit, postal codes 000NN, chart ids SYN-…, barcodes encode SYNTHETIC.
# Coined and screened at EP-10 (2026-09-04). Patients are named per case, never here.
schemaVersion: '0.1'
id: medrecsim-universe
universeVersion: 0.1.0

locality:
  cityName: Corrowell
  regionText: 'no state or county is ever named; artifacts print "Corrowell 000NN"'
  screening:
    date: '2026-09-04'
    venues: [web, rdap, uspto-mirror]
    grade: L0
    note: >-
      Web search for "Corrowell" alone and with "hospital" found no place, organisation or
      person of that name (nearest hits: Corry Memorial Hospital PA, Corvallis OR, Corowa
      NSW). corrowell.com, corrowellgeneral.com and corrowellgeneralhospital.com unregistered
      (RDAP 404). USPTO mirror: 0 marks. The first candidate, "Halvern", was rejected because
      it is a real populated place inside Hayward, California.

institutions:
  - id: inst-corrowell-general
    name: Corrowell General Hospital
    shortName: Corrowell General
    kind: hospital
    descriptionText: >-
      The fictional US general hospital whose emergency department admits every case
      (D-PROD-004). The learner's chart, the imported medication list, prior discharge
      summaries and the inpatient pharmacist all belong to it.
    identifiers:
      phone: 555-0100
      fax: 555-0101
      npi: '0100000001'
      streetText: 1 Hospital Way
      postalCode: '00010'
    screening:
      date: '2026-09-04'
      venues: [web, rdap, uspto-mirror]
      grade: L0
      note: >-
        Web search for "Corrowell General Hospital" and "Corrowell Hospital": no hits. Domains
        unregistered (RDAP 404). USPTO mirror "corrowell general": 0 marks.

  - id: inst-quillbrook-pharmacy
    name: Quillbrook Pharmacy
    shortName: Quillbrook
    kind: community-pharmacy
    descriptionText: >-
      The independent community pharmacy that holds most patients' dispensing history and
      answers the community-pharmacy escalation channel (D-CLIN-002).
    identifiers:
      phone: 555-0142
      fax: 555-0143
      npi: '0100000002'
      streetText: 48 Quillbrook Lane
      postalCode: '00012'
    screening:
      date: '2026-09-04'
      venues: [web, rdap, uspto-mirror]
      grade: L1
      note: >-
        Web search for "Quillbrook Pharmacy": no pharmacy of that name (hits were Millbrook and
        Willowbrook pharmacies). quillbrookpharmacy.com unregistered (RDAP 404); the bare
        quillbrook.com is registered (2020, GoDaddy) and serves a 404 page — not a healthcare
        organisation (L1 adjacency). USPTO mirror "quillbrook": 0 marks.

  - id: inst-tessary-family-medicine
    name: Tessary Family Medicine
    shortName: Tessary FM
    kind: clinic
    descriptionText: >-
      The outpatient primary-care practice most patients see; the outpatient prescriber /
      program office escalation channel (OQ-3) and the source of the single outpatient note
      (D-WF-001).
    identifiers:
      phone: 555-0187
      fax: 555-0188
      npi: '0100000003'
      streetText: 210 Tessary Road, Suite 3
      postalCode: '00014'
    screening:
      date: '2026-09-04'
      venues: [web, rdap, uspto-mirror]
      grade: L1
      note: >-
        Web search for "Tessary Family Medicine", "Tessary clinic", "Tessary medical": no hits
        (nearest: a Dr. James Tess, Orland Park IL — different name). tessaryfamilymedicine.com
        unregistered (RDAP 404); the bare tessary.com is a drop-caught parked domain (2025),
        not a healthcare organisation (L1 adjacency). USPTO mirror "tessary": 0 marks.

